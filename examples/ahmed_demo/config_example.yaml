# AutoFlowCFD 配置文件示例：Ahmed 体稳态 RANS
#
# 平铺的 "键: 值"，字段名与 src/autoflowcfd/config/solver_config.py 的配置类一致，未知字段直接报错。
# 全部字段与缺省值见 docs/CONFIGURATION_GUIDE.md。校验：autoflowcfd config validate examples/ahmed_demo/config_example.yaml
#
# 用法（命令行显式给出的选项优先于本文件）：
#   autoflowcfd grid generate-volume examples/ahmed_demo/ahmed_body_demo.nas -o ahmed/ahmed_volume.nas
#   autoflowcfd solve steady ahmed/ahmed_volume.nas --surface-mesh examples/ahmed_demo/ahmed_body_demo.nas \
#       --config examples/ahmed_demo/config_example.yaml
#
# 边界条件类型来自网格的组名（body / ground / inlet / outlet / tunnel），不在配置文件里设置。

mode: steady

backend: cpu
order: 2                    # 从 P0 逐阶爬坡到 P2（Order Continuation）
turbulence: sa              # SA-neg；高阶隐式稳态推荐
wall_treatment: auto        # 平衡壁面模型，第一层 y+ 从 1 到对数层都可用
time_scheme: newton_krylov  # 隐式稳态；显式为 ssp_rk3
max_iter: 2000
convergence_tol: 1.0e-6     # 残差相对初值下降 1e6 倍即收敛

# 来流（Ahmed 体实验常用 40 m/s）
vel_inf: 40.0
rho_inf: 1.225
p_inf: 101325.0
mu_molecular: 1.8e-5
turbulence_intensity: 0.01
viscosity_ratio: 5.0

output_dir: ./ahmed_results
checkpoint_interval: 100
