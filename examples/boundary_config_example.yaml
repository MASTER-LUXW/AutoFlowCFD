# AutoFlowCFD Boundary Configuration Example (v2.0)
# 
# This file demonstrates the three configuration modes:
# - auto: Automatic boundary detection based on Property Name keywords
# - manual: Full YAML configuration (all properties must be specified)
# - hybrid: YAML priority + automatic fallback (recommended)

boundary_detection:
  mode: "hybrid"  # Options: "auto", "manual", "hybrid"

# Properties mapping (required for manual/hybrid modes)
properties_mapping:
  # Example: Velocity inlet with custom parameters
  INLET:
    type: "VELOCITY_INLET"
    parameters:
      velocity: [40.0, 0.0, 0.0]  # m/s
      turbulence_intensity: 0.05
  
  # Example: Pressure outlet
  OUTLET:
    type: "PRESSURE_OUTLET"
    parameters:
      pressure: 0.0  # Pa (gauge pressure)
  
  # Example: Car body surface with enhanced wall function
  CAR_BODY:
    type: "WALL"
    parameters:
      wall_function: "enhanced"
      roughness_height: 0.0001  # m
  
  # Example: Moving ground plane
  GROUND_PLANE:
    type: "WALL"
    parameters:
      wall_function: "moving_wall"
      velocity: [40.0, 0.0, 0.0]  # m/s (ground speed)
  
  # Example: Symmetry plane
  SYMMETRY:
    type: "SYMMETRY"
  
  # Example: Wind tunnel walls (slip wall)
  TUNNEL_WALL:
    type: "SLIP_WALL"

# Default parameters for each boundary type
defaults:
  velocity_inlet:
    velocity: [33.33, 0.0, 0.0]  # 120 km/h
    turbulence_intensity: 0.05
  
  pressure_outlet:
    pressure: 0.0
  
  wall:
    wall_function: "standard"
  
  symmetry: {}
  
  slip_wall: {}
