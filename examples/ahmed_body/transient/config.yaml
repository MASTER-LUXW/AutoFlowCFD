# Ahmed Body Transient DES Simulation Configuration
#  Ahmed Body标准算例 - 瞬态DES仿真配置

simulation:
  name: "ahmed_body_transient"
  type: "transient"
  description: "Transient DES simulation of Ahmed body with SST-DDES turbulence model"

grid:
  file: "../../ahmed_body_demo.nas"
  format: "nas"
  validate_quality: true

solver:
  backend: "cpu"  # Use "gpu" for GPU acceleration
  order: 2  # FR scheme order (1, 2, or 3)
  
turbulence:
  model: "dDES"  # Delayed Detached Eddy Simulation
  wall_treatment: "standard"

boundary_conditions:
  inlet:
    type: "velocity_inlet"
    velocity: 30.0  # m/s
    turbulence_intensity: 0.05
    hydraulic_diameter: 1.0
  
  outlet:
    type: "pressure_outlet"
    pressure: 0.0  # Pa (gauge)
  
  walls:
    type: "wall"
  
  ground:
    type: "moving_wall"
    velocity: 30.0  # m/s
  
  symmetry:
    type: "symmetry"

time_integration:
  method: "backward_euler"  # backward_euler, rk2, ab3
  physical_time: 0.3  # Total physical time (seconds)
  dt: 1.0e-4  # Time step size (seconds)
  checkpoint_interval: 0.01  # Save checkpoint every 0.01s

numerical:
  cfl: 5.0
  adaptive_cfl: false  # Fixed CFL for transient

convergence:
  max_iterations: 3000  # physical_time / dt
  monitor_coefficients: true
  sampling_start_time: 0.1  # Start statistics after initial transient

output:
  directory: "./output"
  vtk_export: true
  vtk_interval: 0.01  # Export VTK every 0.01s
  vtk_fields: ["velocity", "pressure", "k", "omega"]
  convergence_csv: true
  report_json: true
  transient_statistics: true
  statistics_fields: ["velocity", "pressure"]
  
reference:
  area: 0.0396  # Ahmed body frontal area (m²)
  length: 1.044  # Ahmed body length (m)
  density: 1.225  # Air density (kg/m³)
  velocity: 30.0  # Freestream velocity (m/s)

monitoring:
  pressure_probes:
    - name: "wake_center"
      position: [0.5, 0.0, 0.1]  # x, y, z (meters)
    - name: "upper_wake"
      position: [0.5, 0.0, 0.3]
