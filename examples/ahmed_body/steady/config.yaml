# Ahmed Body Steady RANS Simulation Configuration
#  Ahmed Body标准算例 - 稳态RANS仿真配置

simulation:
  name: "ahmed_body_steady"
  type: "steady"
  description: "Steady RANS simulation of Ahmed body with SST k-omega turbulence model"

grid:
  file: "../../ahmed_body_demo.nas"
  format: "nas"
  validate_quality: true

solver:
  backend: "cpu"  # Use "gpu" for GPU acceleration
  order: 2  # FR scheme order (1, 2, or 3)
  
turbulence:
  model: "sst_kw"  # SST k-omega model
  wall_treatment: "standard"  # Standard wall function

boundary_conditions:
  inlet:
    type: "velocity_inlet"
    velocity: 30.0  # m/s
    turbulence_intensity: 0.05
    hydraulic_diameter: 1.0
  
  outlet:
    type: "pressure_outlet"
    pressure: 0.0  # Pa (gauge)
  
  walls:
    type: "wall"
  
  ground:
    type: "moving_wall"
    velocity: 30.0  # m/s (same as freestream)
  
  symmetry:
    type: "symmetry"

numerical:
  cfl: 5.0
  adaptive_cfl: true
  cfl_min: 1.0
  cfl_max: 100.0
  
convergence:
  max_iterations: 1000
  residual_threshold: 1.0e-4
  monitor_coefficients: true

output:
  directory: "./output"
  vtk_export: true
  vtk_fields: ["velocity", "pressure"]
  convergence_csv: true
  report_json: true
  
reference:
  area: 0.0396  # Ahmed body frontal area (m²)
  length: 1.044  # Ahmed body length (m)
  density: 1.225  # Air density (kg/m³)
  velocity: 30.0  # Freestream velocity (m/s)
