name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Black check
        run: poetry run black --check src/ tests/

      - name: Run isort check
        run: poetry run isort --check-only --profile black src/ tests/

      - name: Run flake8
        run: poetry run flake8 src/ tests/

      - name: Run mypy
        run: poetry run mypy src/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run pytest with coverage
        run: |
          poetry run pytest tests/unit -v --cov=autoflowcfd --cov-report=xml
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Build package
        run: poetry build

      - name: Verify build
        run: |
          ls -lh dist/
          poetry run python -c "import tarfile; tarfile.open('dist/autoflowcfd-0.1.0.tar.gz')"
