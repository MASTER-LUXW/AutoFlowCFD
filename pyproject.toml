[tool.poetry]
name = "autoflowcfd"
version = "0.1.0"
description = "High-performance open-source CFD software for automotive external aerodynamics"
authors = ["AutoFlowCFD Team", "Mr Lu <luxw_chd@126.com>"]
maintainers = ["Mr Lu <luxw_chd@126.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/AutoFlowCFD/AutoFlowCFD"
documentation = "https://github.com/AutoFlowCFD/AutoFlowCFD/tree/main/docs"
keywords = ["cfd", "automotive", "aerodynamics", "flux-reconstruction", "gpu-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
numpy = "^1.26.0"
scipy = "^1.10.0"
click = "^8.1.0"
pyyaml = "^6.0.0"
h5py = "^3.9.0"
loguru = "^0.7.0"
pyvista = "^0.44.0"
numba = "^0.60.0"
llvmlite = "0.43.0"

tetgen = "^0.8.4"
packaging = ">=23.0"

# GPU support (optional)
cupy-cuda12x = {version = "^12.2.0", optional = true}
# MPI 分布式（--n-ranks > 1）：通信与 METIS 图划分
mpi4py = {version = ">=3.1", optional = true}
pymetis = {version = ">=2023.1", optional = true}
# utils benchmark 的内存统计
psutil = {version = ">=5.9", optional = true}

[tool.poetry.group.dev.dependencies]
flake8 = "^6.1.0"
mypy = "^1.5.0"
# mypy 检查 config/loader.py 的 yaml 导入所需的类型存根
types-PyYAML = "^6.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pre-commit = "^3.3.0"

[tool.poetry.extras]
gpu = ["cupy-cuda12x"]
mpi = ["mpi4py", "pymetis"]
perf = ["psutil"]

[tool.poetry.scripts]
autoflowcfd = "autoflowcfd.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# 默认严格度（不要求全部函数带类型标注），报错修到零
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["autoflowcfd"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    '^\s*pass\s*$',
    "raise ImportError",
]
fail_under = 80
show_missing = true
